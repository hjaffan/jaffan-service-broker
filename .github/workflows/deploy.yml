name: CI / Deploy to Cloud Foundry

# Build + test the broker on a GitHub runner, then cf push the resulting jar.
# The classic CF Java buildpack does NOT compile source, so the jar is built here and pushed.
#
# Required GitHub configuration (Settings -> Secrets and variables -> Actions):
#
#   Repository VARIABLES (non-sensitive):
#     CF_API, CF_ORG, CF_SPACE
#     CF_SKIP_SSL_VALIDATION           "true" only if the CF API uses a self-signed cert
#     DEPROVISION_MODE                 optional: soft (default) | drop
#     REGISTER_BROKER                  optional: "true" to (re)register the broker after deploy
#     PG_DEV_HOST,  PG_DEV_PORT,  PG_DEV_EXTERNAL_HOST   (EXTERNAL_HOST optional)
#     PG_PROD_HOST, PG_PROD_PORT, PG_PROD_EXTERNAL_HOST
#     MARIA_DEV_HOST,  MARIA_DEV_PORT,  MARIA_DEV_EXTERNAL_HOST
#     MARIA_PROD_HOST, MARIA_PROD_PORT, MARIA_PROD_EXTERNAL_HOST
#
#   Repository SECRETS (sensitive):
#     CF_USERNAME, CF_PASSWORD                          CF deploy account
#     BROKER_USER, BROKER_PASSWORD                      HTTP Basic creds the platform uses on /v2/**
#     PG_DEV_ADMIN_USER,   PG_DEV_ADMIN_PASSWORD
#     PG_PROD_ADMIN_USER,  PG_PROD_ADMIN_PASSWORD
#     MARIA_DEV_ADMIN_USER,  MARIA_DEV_ADMIN_PASSWORD
#     MARIA_PROD_ADMIN_USER, MARIA_PROD_ADMIN_PASSWORD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # `mvn verify` runs the unit tests AND the Testcontainers integration tests.
      # GitHub-hosted ubuntu runners ship Docker, so the postgres:16 / mariadb:11
      # provision->bind->use->unbind->deprovision lifecycle tests really execute here.
      - name: Build and test
        run: mvn -B -ntp verify

      - name: Upload broker jar
        uses: actions/upload-artifact@v4
        with:
          name: broker-jar
          path: target/jaffan-db-broker.jar
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Cloud Foundry
    needs: build
    # Only deploy from main; PRs get the build/test gate but never push.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloud-foundry
    concurrency:
      group: cf-deploy-${{ github.ref }}
      cancel-in-progress: false
    env:
      APP_NAME: jaffan-db-broker
      BROKER_NAME: jaffan-db
      CF_API: ${{ vars.CF_API }}
      CF_ORG: ${{ vars.CF_ORG }}
      CF_SPACE: ${{ vars.CF_SPACE }}
      CF_SKIP_SSL_VALIDATION: ${{ vars.CF_SKIP_SSL_VALIDATION }}
      # cf auth reads these two from the environment; they never appear on a command line.
      CF_USERNAME: ${{ secrets.CF_USERNAME }}
      CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
    steps:
      - name: Checkout (for manifest.yml)
        uses: actions/checkout@v4

      - name: Download broker jar
        uses: actions/download-artifact@v4
        with:
          name: broker-jar
          path: target

      - name: Install cf CLI v8
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -sL "https://packages.cloudfoundry.org/stable?release=linux64-binary&version=v8&source=github" \
            | tar -zx -C "$HOME/bin" cf8 cf
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Authenticate & target
        run: |
          set -euo pipefail
          cf version
          SSL_FLAG=""
          if [ "$(printf '%s' "${CF_SKIP_SSL_VALIDATION:-}" | tr '[:upper:]' '[:lower:]')" = "true" ]; then
            SSL_FLAG="--skip-ssl-validation"
          fi
          cf api "$CF_API" $SSL_FLAG
          cf auth                      # uses CF_USERNAME / CF_PASSWORD from the environment
          cf target -o "$CF_ORG" -s "$CF_SPACE"

      - name: Push, configure env, and start
        env:
          BROKER_USER: ${{ secrets.BROKER_USER }}
          BROKER_PASSWORD: ${{ secrets.BROKER_PASSWORD }}

          PG_DEV_HOST: ${{ vars.PG_DEV_HOST }}
          PG_DEV_PORT: ${{ vars.PG_DEV_PORT }}
          PG_DEV_ADMIN_USER: ${{ secrets.PG_DEV_ADMIN_USER }}
          PG_DEV_ADMIN_PASSWORD: ${{ secrets.PG_DEV_ADMIN_PASSWORD }}
          PG_DEV_EXTERNAL_HOST: ${{ vars.PG_DEV_EXTERNAL_HOST }}

          PG_PROD_HOST: ${{ vars.PG_PROD_HOST }}
          PG_PROD_PORT: ${{ vars.PG_PROD_PORT }}
          PG_PROD_ADMIN_USER: ${{ secrets.PG_PROD_ADMIN_USER }}
          PG_PROD_ADMIN_PASSWORD: ${{ secrets.PG_PROD_ADMIN_PASSWORD }}
          PG_PROD_EXTERNAL_HOST: ${{ vars.PG_PROD_EXTERNAL_HOST }}

          MARIA_DEV_HOST: ${{ vars.MARIA_DEV_HOST }}
          MARIA_DEV_PORT: ${{ vars.MARIA_DEV_PORT }}
          MARIA_DEV_ADMIN_USER: ${{ secrets.MARIA_DEV_ADMIN_USER }}
          MARIA_DEV_ADMIN_PASSWORD: ${{ secrets.MARIA_DEV_ADMIN_PASSWORD }}
          MARIA_DEV_EXTERNAL_HOST: ${{ vars.MARIA_DEV_EXTERNAL_HOST }}

          MARIA_PROD_HOST: ${{ vars.MARIA_PROD_HOST }}
          MARIA_PROD_PORT: ${{ vars.MARIA_PROD_PORT }}
          MARIA_PROD_ADMIN_USER: ${{ secrets.MARIA_PROD_ADMIN_USER }}
          MARIA_PROD_ADMIN_PASSWORD: ${{ secrets.MARIA_PROD_ADMIN_PASSWORD }}
          MARIA_PROD_EXTERNAL_HOST: ${{ vars.MARIA_PROD_EXTERNAL_HOST }}

          DEPROVISION_MODE: ${{ vars.DEPROVISION_MODE }}
        run: |
          set -euo pipefail
          # Upload bits without starting, so env is set before the app boots (it fails fast without it).
          cf push "$APP_NAME" -f manifest.yml --no-start

          # Set only the non-empty variables, so optional ones (EXTERNAL_HOST, DEPROVISION_MODE) are
          # skipped rather than set to "". cf set-env prints the key name, never the value.
          for name in \
            BROKER_USER BROKER_PASSWORD \
            PG_DEV_HOST PG_DEV_PORT PG_DEV_ADMIN_USER PG_DEV_ADMIN_PASSWORD PG_DEV_EXTERNAL_HOST \
            PG_PROD_HOST PG_PROD_PORT PG_PROD_ADMIN_USER PG_PROD_ADMIN_PASSWORD PG_PROD_EXTERNAL_HOST \
            MARIA_DEV_HOST MARIA_DEV_PORT MARIA_DEV_ADMIN_USER MARIA_DEV_ADMIN_PASSWORD MARIA_DEV_EXTERNAL_HOST \
            MARIA_PROD_HOST MARIA_PROD_PORT MARIA_PROD_ADMIN_USER MARIA_PROD_ADMIN_PASSWORD MARIA_PROD_EXTERNAL_HOST \
            DEPROVISION_MODE; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              cf set-env "$APP_NAME" "$name" "$value" >/dev/null
            fi
          done

          cf start "$APP_NAME"

      - name: Register / update service broker (optional)
        if: ${{ vars.REGISTER_BROKER == 'true' }}
        env:
          BROKER_USER: ${{ secrets.BROKER_USER }}
          BROKER_PASSWORD: ${{ secrets.BROKER_PASSWORD }}
        run: |
          set -euo pipefail
          route="$(cf app "$APP_NAME" | awk '/^routes:/ {print $2; exit}')"
          if [ -z "$route" ]; then
            echo "could not determine app route; skipping broker registration" >&2
            exit 1
          fi
          url="https://${route}"
          echo "broker url: ${url}"
          if cf service-brokers | awk '{print $1}' | grep -qx "$BROKER_NAME"; then
            cf update-service-broker "$BROKER_NAME" "$BROKER_USER" "$BROKER_PASSWORD" "$url"
          else
            # Space-scoped registration needs no CF admin. Promote to global manually (see README).
            cf create-service-broker "$BROKER_NAME" "$BROKER_USER" "$BROKER_PASSWORD" "$url" --space-scoped
          fi
